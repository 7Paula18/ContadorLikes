
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Likes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Interactividad con el DOM</h1>

        <p class="description">
            Haz clic en el botón para incrementar el contador
            y registrar la hora de cada interacción.
        </p>

        <div id="contador">0</div>

        <button id="btn-like">Me gusta</button>

        <h2>Registro de clics</h2>

        <table>
            <thead>
                <tr>
                    <th>Nº Clic</th>
                    <th>Hora</th>
                </tr>
            </thead>

            <tbody id="tabla-registros">
            </tbody>
        </table>
    </main>

    <script src="script.js"></script>
</body>
</html>
